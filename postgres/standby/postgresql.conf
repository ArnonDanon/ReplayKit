# ── ReplayKit Standby PostgreSQL Configuration ────────────────────────────────
# hot_standby lets read queries run while replicating from primary.

listen_addresses = '*'
port = 5432

# Replication
hot_standby = on
wal_level = replica
max_wal_senders = 5        # so this node can itself become primary later
wal_keep_size = 256MB

# Performance — match primary
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 256MB
