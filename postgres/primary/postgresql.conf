# ── ReplayKit Primary PostgreSQL Configuration ────────────────────────────────
# Streaming replication settings

listen_addresses = '*'
port = 5432

# Replication
wal_level = replica
max_wal_senders = 5
wal_keep_size = 256MB
hot_standby = on

# Performance (conservative defaults for a lightweight deployment)
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 256MB
