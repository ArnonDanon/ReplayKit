# ── ReplayKit Primary pg_hba.conf ─────────────────────────────────────────────
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local connections
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Application user — same Docker network
host    replaykit       replaykit       all                     scram-sha-256

# Streaming replication — allow replicator from anywhere (standby IP varies)
host    replication     replicator      all                     scram-sha-256
